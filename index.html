.analysis-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 16px}.analysis-actions .chip{width:100%;min-width:0;white-space:normal;min-height:43px;padding:9px 7px}.repeat-tag{display:flex!important;align-items:center;gap:4px;color:#6273a0!important;font-size:10px!important;margin-top:4px!important}.repeat-tag svg{flex:none}.transaction.swipe-left:before{font-size:13px}.budget-row .iconbtn{flex:none}@media(max-width:380px){.analysis-actions{gap:6px}}
/* Indicadores de Drive sin cubrir controles ni formularios. */
#driveStateSlot{height:0;overflow:hidden;transition:height .2s ease}
#driveStateSlot:has(#driveStateBar:not([hidden])){height:50px}
#driveStateSlot:has(#driveStateBar:not([hidden]) button:not([hidden])){height:62px}
.top{transition:margin-bottom .2s ease}
.top:has(+ #driveStateSlot #driveStateBar:not([hidden])){margin-bottom:10px}
#driveStateBar,#driveToast{z-index:6;background:#fff;border:1px solid #e4e9f4;box-shadow:0 4px 14px #243e691c;color:#4164a4}
#driveStateBar[hidden],#driveToast[hidden]{display:none!important}
#driveStateBar{min-height:38px;border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:9px;font-size:12px;font-weight:650;line-height:1.3}
#driveStateBar .sync-dot{width:9px;height:9px;border-radius:50%;background:#ec9b48;flex:none}#driveStateBar[data-state=active] .sync-dot{background:#4164a4;animation:drive-status-pulse 1.4s ease-in-out infinite}
#driveStateBar button{margin-left:auto;border:0;background:transparent;color:inherit;min-width:62px;min-height:32px;padding:4px;font-size:12px;font-weight:700;border-radius:8px}#driveStateBar button:hover,#driveStateBar button:focus-visible{background:#f4f1f7}
#driveToast{position:fixed;left:50%;width:min(420px,calc(100vw - 24px));transform:translateX(-50%);bottom:calc(172px + env(safe-area-inset-bottom));border-radius:12px;padding:10px 11px;display:flex;align-items:center;gap:9px;font-size:12px;line-height:1.4}
#driveToast[data-tone=error]{color:#9f4b36;border-color:#f0dacd}#driveToast[data-tone=success]{color:#168568;border-color:#d7eadf}
#driveToastMessage{flex:1;min-width:0;overflow-wrap:anywhere}#driveToast button{border:0;background:transparent;color:inherit;min-width:32px;min-height:32px;padding:4px;font-weight:700;border-radius:8px}
#driveToast button:hover,#driveToast button:focus-visible{background:#f4f1f7}#driveToastDismiss{font-size:18px;line-height:1}
@keyframes drive-status-pulse{50%{opacity:.45;transform:scale(.75)}}
@media(max-width:400px){#driveToast{bottom:calc(164px + env(safe-area-inset-bottom))}}
@media(prefers-reduced-motion:reduce){#driveStateBar .sync-dot{animation:none!important}#driveStateSlot,.top{transition:none!important}}

/* Mejora 22: la misma interfaz se distribuye en más espacio de trabajo. */
#desktopNav,.desktop-brand{display:none}
@media(min-width:700px) and (max-width:1023px){

}

 .top{grid-column:2/4;grid-row:1;min-width:0}
 .top .logo{display:none}.desktop-brand{display:block;color:#202637;font-size:23px;font-weight:800}
 #driveStateSlot{grid-column:2/4;grid-row:2}
 #main{grid-column:2;grid-row:3;min-width:0}
 #desktopNav{grid-column:1;grid-row:1/4;position:sticky;top:24px;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:calc(100dvh - 50px);padding:12px 10px;border-right:1px solid #e4e9f4}
 #desktopNav .nav{width:44px;height:44px;flex:none;display:grid;place-items:center;padding:0;border-radius:13px;color:#6e7580}
 #desktopNav .nav span{display:none}#desktopNav .nav.active{background:#edf2fa;color:#4269e8}

 #modal[data-inline-quick=true] .sheet{width:100%;max-height:none;border:0;border-radius:0;background:transparent;box-shadow:none;padding:0}
 #modal[data-inline-quick=true] .quick-close{display:none}

}
@media(min-width:1280px){

 #main:has(> .heading-row) > .heading-row{grid-column:1;grid-row:1}

 #main:has(> .total-account){display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);column-gap:24px;align-content:start}
 #main:has(> .total-account) > .total-account{grid-column:1;grid-row:1;align-self:start}
 #main:has(> .total-account) > .total-account + .flat-list{grid-column:2;grid-row:1;min-width:0}

/* Mejora 24: detalles accesibles de gastos y proyección */
.finance-breakdown{margin:12px 0;padding:13px 15px;border:1px solid var(--line,#e9e5df);border-radius:15px;background:var(--card,#fff)}
.finance-breakdown>summary{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;font-weight:650;list-style:none}
.finance-breakdown>summary::-webkit-details-marker{display:none}
.finance-breakdown>summary:after{content:'⌄';font-size:20px;transition:transform .2s}
.finance-breakdown[open]>summary:after{transform:rotate(180deg)}
.finance-breakdown-list{padding-top:9px}
.finance-breakdown-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line,#eeeae5)}
.finance-breakdown-row>div{min-width:0}.finance-breakdown-row strong{display:block;overflow-wrap:anywhere;font-size:13px}.finance-breakdown-row small{display:block;color:var(--muted,#777);font-size:11px;margin-top:3px}.finance-breakdown-row>b{white-space:nowrap;font-size:13px}.finance-breakdown-row>.amount.expense{color:#d94e65}.finance-breakdown-row>.amount.income{color:#168b68}.finance-breakdown-empty{color:var(--muted,#777);font-size:13px;padding:12px 0 2px}

.metric-detail-link{display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;padding:0;margin-top:9px;color:#5472b9;font:inherit;font-size:11px;font-weight:650;cursor:pointer;text-align:left}
.metric-detail-link:hover{text-decoration:underline}.metric-detail-link:focus-visible{outline:2px solid #5472b9;outline-offset:4px;border-radius:3px}.metric-detail-link[aria-expanded="true"]{color:#34425b}
.detail-display{margin:11px 0 14px;padding:14px 16px;background:#fff;border:1px solid #e9edf2;border-radius:15px;box-shadow:0 2px 9px rgba(36,50,72,.035)}
.detail-display[hidden]{display:none}.detail-display-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:9px;border-bottom:1px solid #edf0f5}
.detail-display-head strong{font-size:13px;color:#34425b}.detail-display-close{border:0;background:transparent;color:#7c889a;cursor:pointer;padding:4px 6px;font-size:18px;line-height:1}
.detail-display-list{max-height:340px;overflow-y:auto}.detail-display .finance-breakdown-row{padding:11px 0}
@media(max-width:480px){.detail-display{padding:12px 13px}.metric-detail-link{font-size:10.5px}}

   finally{busy=false}
 }
async function createDriveFile(name,json){const boundary='finanzas'+uuid().replace(/[^a-z0-9]/gi,'');const body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name,parents:['appDataFolder'],mimeType:'application/json'})+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+json+'\r\n--'+boundary+'--';const r=await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body});const id=(await r.json()).id;if(!id)throw Error('Google Drive no confirmó el identificador de la nueva copia.');return id}
async function upload(data){const json=JSON.stringify(data);if(!driveFileId)driveFileId=await createDriveFile(FILE,json);else await api('https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(driveFileId)+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:json})}
async function backupRemote(id,expected){const raw=await readFileRaw(id);if(await dataHash(normalizeRemote(raw))!==expected)throw Error('La copia remota cambió antes de crear el respaldo.');const name='mis-finanzas-respaldo-'+new Date().toISOString().replace(/[:.]/g,'-')+'-'+uuid()+'.json';const backupId=await createDriveFile(name,raw);const saved=await readFileRaw(backupId);if(await hash(saved)!==await hash(raw)||await dataHash(normalizeRemote(saved))!==expected)throw Error('El respaldo remoto no pasó la verificación de lectura.');return {name,rawHash:await hash(raw)}}
function chooseConflict(){return new Promise(resolve=>{open(`<div class="between"><h2 id="driveConflictTitle">Conflicto de Google Drive</h2><button type="button" class="iconbtn" id="driveConflictClose" aria-label="Cerrar">✕</button></div><div class="drive-box" role="group" aria-labelledby="driveConflictTitle"><p>Hay cambios distintos en este dispositivo y en Google Drive. Elige qué versión conservar. No se fusionarán movimientos.</p><button type="button" class="primary" id="driveKeepLocal">Conservar datos de este dispositivo</button><p>Se guardará primero un respaldo de Drive. Después, los datos de este dispositivo reemplazarán el archivo principal de Drive.</p><button type="button" class="secondary" id="driveUseRemote">Utilizar datos de Google Drive</button><p>Los datos de Drive reemplazarán los datos de este dispositivo. Los cambios locales que no estén en Drive dejarán de aparecer aquí.</p><button type="button" class="secondary" id="driveConflictCancel">Cancelar</button></div>`);const finish=choice=>{close();resolve(choice)};document.getElementById('driveKeepLocal').onclick=()=>finish('local');document.getElementById('driveUseRemote').onclick=()=>finish('remote');document.getElementById('driveConflictCancel').onclick=()=>finish('cancel');document.getElementById('driveConflictClose').onclick=()=>finish('cancel');document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')finish('cancel')}})}
function applyRemote(data){const copy=normalizeRemote(data),stored=JSON.parse(localStorage.getItem(KEY)||'{}'),localSettings=record(stored.settings)?stored.settings:db.settings||{};copy.settings={...copy.settings,...localSettings};localStorage.setItem(KEY,JSON.stringify(copy));db=copy;close();render();window.dispatchEvent(new Event('finanzas-drive-loaded'))}
async function localUnchanged(expected){if(await dataHash(snapshot())!==expected)throw Error('Los datos locales cambiaron durante la sincronización. Reintenta para evitar una sobrescritura.');}
async function remoteUnchanged(expected){const current=await remote();if((current?await dataHash(current):null)!==expected)throw Error('La copia de Drive cambió durante la sincronización. Reintenta y revisa los cambios.');}
async function localSnapshotUnchanged(expected){if(await hash(snapshot())!==expected)throw Error('Los datos locales cambiaron durante la resolución del conflicto. No se reemplazó Drive.');}
async function sync(interactive=false){
 if(busy||!cfg().clientId)return;
 if(!navigator.onLine){pendingStatus();return}
 if(conflict&&!interactive){pendingStatus();return}
 if(!hasToken()){if(!interactive){pendingStatus();return}await authorize(true)}
 busy=true;notifyVerifiedSync=interactive||pending;setStatus('Drive · Sincronizando','connected');
 let backupName='',uploadStarted=false;
 try{
  const local=snapshot(),lh=await dataHash(local),r=await remote(),rh=r?await dataHash(r):null;
  if(!r){await localUnchanged(lh);await remoteUnchanged(null);await upload(local);const stored=await readFileRaw(driveFileId);if(stored!==JSON.stringify(local)||await dataHash(normalizeRemote(stored))!==lh)throw Error('La copia subida no pasó la verificación de lectura.');localStorage.setItem(BASE,lh)}
  else if(lh===rh){await localUnchanged(lh);localStorage.setItem(BASE,lh)}
  else{
   conflict=true;
   if(!interactive){setStatus('Drive · Conflicto pendiente','problem');return}
   const choice=await chooseConflict();
   if(choice==='cancel'){pendingStatus();return}
   if(choice==='local'){
    if(!confirm('Se creará un respaldo de la versión actual de Drive. Después, los datos de este dispositivo REEMPLAZARÁN el archivo principal en Drive. ¿Continuar?')||!confirm('¿Confirmas que este dispositivo tiene la versión que deseas conservar en Drive? No se fusionarán los cambios.')){pendingStatus();return}
    const localHash=await hash(local),targetId=driveFileId;
    await localSnapshotUnchanged(localHash);await remoteUnchanged(rh);
    if(driveFileId!==targetId)throw Error('Cambió el archivo principal de Drive.');
    const backup=await backupRemote(targetId,rh);backupName=backup.name;
    await localSnapshotUnchanged(localHash);await remoteUnchanged(rh);
    if(driveFileId!==targetId||await hash(await readFileRaw(targetId))!==backup.rawHash)throw Error('Drive cambió después de crear el respaldo. No se reemplazó el archivo principal.');
    uploadStarted=true;await upload(local);
    const stored=await readFileRaw(targetId);
    if(stored!==JSON.stringify(local)||await dataHash(normalizeRemote(stored))!==lh)throw Error('La copia subida no pasó la verificación de lectura. El respaldo remoto permanece en Drive.');
    localStorage.setItem(BASE,lh);
   }else{
    if(!confirm('Los datos de Google Drive REEMPLAZARÁN los datos locales de este dispositivo. Los cambios locales que falten en Drive dejarán de aparecer aquí. ¿Continuar?')||!confirm('¿Confirmas que deseas utilizar Drive sin fusionar movimientos?')){pendingStatus();return}
    await localUnchanged(lh);await remoteUnchanged(rh);applyRemote(r);localStorage.setItem(BASE,rh);
   }
  }
  conflict=false;pending=false;setStatus('Drive · Al día','connected');
  if(backupName)alert('Google Drive se actualizó con los datos de este dispositivo. La copia anterior sigue disponible como '+backupName+'.');
 }catch(e){if(conflict)pendingStatus();else setStatus(pending?'Drive · Pendiente':'Drive · Revisar','problem');if(pending&&!conflict)showDriveToast('sync-error','No se pudo sincronizar. Los cambios permanecen en este dispositivo.','error','review');if(interactive)alert('No se pudo sincronizar: '+e.message+(backupName?'\nEl respaldo remoto '+backupName+' permanece en Drive.':'')+(uploadStarted?'\nEl estado del archivo principal requiere revisión.':''));console.warn('Sincronización Drive:',e)}
 finally{busy=false;notifyVerifiedSync=false}
}
// Intento no interactivo, solo una vez por apertura. Google puede exigir un gesto del usuario.
async function reconnectSilently(){
 if(silentAttempted||!navigator.onLine||document.hidden||busy||hasToken())return;
 silentAttempted=true;
 try{
  await authorize(false);
  await sync(false);
 }catch(e){
  console.info('Drive: reconexión silenciosa no disponible:',e?.message||e);
  pendingStatus();
 }
}
function schedule(){clearTimeout(timer);timer=setTimeout(()=>sync(false),1800)}
window.addEventListener('finanzas-local-save',()=>{pending=true;if(!busy)pendingStatus();schedule()});
window.addEventListener('online',()=>{if(!silentAttempted&&!hasToken())return reconnectSilently();schedule()});
window.addEventListener('offline',()=>{if(!busy)pendingStatus()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(!silentAttempted&&!hasToken())return reconnectSilently();schedule()}});
setInterval(()=>{if(document.hidden||!navigator.onLine)return;if(hasToken())schedule();else if(!busy&&!connecting)pendingStatus()},60000);
refreshPending();
window.addEventListener('finanzas-refresh-drive-status',()=>setStatus(lastStatus,lastKind));window.addEventListener('finanzas-open-drive-panel',()=>showPanel());function showPanel(){const c=cfg();open(`<div class="between"><h2>Google Drive <small style="font-size:11px;color:#667085">Corrección 7 · 10/10/2026</small></h2><button class="iconbtn" data-action="close">✕</button></div><div class="drive-box"><p>Sincroniza tus datos privados de Mis Finanzas con tu Google Drive. Solo se solicita acceso a los datos privados de esta aplicación, no a tus otros archivos.</p><label class="field">ID de cliente OAuth (aplicación web)<input id="driveClientId" type="text" placeholder="123456789-...apps.googleusercontent.com" value="${esc(c.clientId||'')}"></label><p>En Google Cloud configura una pantalla de consentimiento y un cliente OAuth tipo <b>Aplicación web</b>. Agrega el origen HTTPS donde publiques la app en <b>Orígenes autorizados de JavaScript</b>. Si está en modo pruebas, agrega tu correo como usuario de prueba.</p><button class="secondary" id="driveSaveConfig">Guardar ID</button><button class="primary" id="driveConnect">Conectar Google y sincronizar</button><button class="secondary" id="driveSyncNow">Sincronizar ahora</button><button class="secondary" id="driveReset" style="border:1px solid #dc8791;color:#ad3c4c;background:#fff8f8">Reiniciar y verificar copia</button><p class="danger-text">Solo si no necesitas conservar la copia anterior de Mis Finanzas en Drive. Requiere doble confirmación.</p><p>Estado: <b>${esc(lastStatus)}</b>. Los datos se guardan también en este navegador. Si dos dispositivos cambian los datos a la vez, se pedirá elegir una versión para evitar sobrescrituras silenciosas.</p><p class="danger-text">No abras el HTML directamente desde Descargas para autenticarte: publícalo en HTTPS. Nunca compartas secretos OAuth ni contraseñas.</p></div>`);document.getElementById('driveSaveConfig').onclick=()=>{const id=document.getElementById('driveClientId').value.trim();if(!validId(id))return alert('ID de cliente OAuth no válido.');if(id!==cfg().clientId){token='';client=null;localStorage.removeItem(BASE)}config({clientId:id});alert('ID guardado en este navegador.')};document.getElementById('driveConnect').onclick=async()=>{try{const id=document.getElementById('driveClientId').value.trim();if(!validId(id))return alert('Primero introduce un ID OAuth válido.');if(id!==cfg().clientId){token='';client=null;localStorage.removeItem(BASE)}config({clientId:id});await authorize(true);close();await sync(true)}catch(e){alert('No se pudo conectar: '+e.message)}};document.getElementById('driveSyncNow').onclick=async()=>{close();try{await sync(true)}catch(e){alert(e.message)}};document.getElementById('driveReset').onclick=resetRemote}
if(cfg().clientId){
  pendingStatus();
  setTimeout(reconnectSilently,0);
}
})();
</script>
