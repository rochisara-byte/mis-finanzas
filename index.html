function normalizeRemote(raw){
  let d=raw;
  for(let depth=0;depth<4;depth++){
    if(typeof d==='string'){try{d=JSON.parse(d);continue}catch{break}}
    if(d&&typeof d==='object'&&!Array.isArray(d)){
      if(Array.isArray(d.transactions)&&Array.isArray(d.accounts))return d;
      const next=[d.data,d.snapshot,d.backup,d.financeData,d.state,d.db].find(x=>x&&typeof x==='object'||typeof x==='string');
      if(next){d=next;continue}
    }
    break;
  }
  return null;
}
async function remote(){
  const q=encodeURIComponent("name = '"+FILE+"' and trashed = false");
  const r=await api('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q='+q+'&fields=files(id,name,mimeType),nextPageToken&page_size=100');
  const j=await r.json();
  const files=j.files||[];
  if(!files.length){driveFileId='';return null}
  let invalid=0;
  for(const file of files){
    const response=await api('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(file.id)+'?alt=media');
    const body=await response.text();
    let parsed;
    try{parsed=JSON.parse(body)}catch{invalid++;continue}
    const d=normalizeRemote(parsed);
    if(d){driveFileId=file.id;return d}
    invalid++;
  }
  // No subir ni reemplazar una copia desconocida: podría contener información recuperable.
  throw Error('Hay '+invalid+' copia(s) en Drive con un formato no reconocido. No se modificó ninguna. Exporta una copia JSON local antes de continuar y comparte el formato de la copia remota para recuperarla.');
}
 async function resetRemote(){
   if(busy)return alert('Espera a que termine la operación anterior.');
   const approval=prompt('Se eliminarán SOLO las copias de sincronización de Mis Finanzas del espacio privado de esta aplicación en Google Drive. Después se creará una copia nueva con los datos de este navegador.\n\nEsta acción no se puede deshacer. Escribe REINICIAR para confirmar:');
   if(approval!=='REINICIAR')return;
   if(!confirm('¿Confirmas que NO necesitas recuperar la copia anterior de Mis Finanzas en Google Drive?'))return;
   busy=true;setStatus('Drive · Reiniciando','connected');
   try{
     const data=snapshot();
     if(!Array.isArray(data.accounts)||!Array.isArray(data.transactions))throw Error('Los datos locales no tienen el formato esperado.');
     await authorize(true);
     // Consultar siempre la primera página: al eliminar archivos cambian las páginas.
     const q=encodeURIComponent("name = '"+FILE+"' and trashed = false");
     const listUrl='https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q='+q+'&fields=nextPageToken,files(id,name)&page_size=100';
     let removed=0;
     for(let pass=0;pass<30;pass++){
       const result=await (await api(listUrl)).json();
       const files=(result.files||[]).filter(f=>f.name===FILE);
       if(!files.length){if(result.nextPageToken)throw Error('No se pudieron revisar todas las copias remotas.');break}
       for(const file of files){
         await api('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(file.id),{method:'DELETE'});
         removed++;
       }
       if(pass===29)throw Error('Demasiadas copias remotas; reinicio incompleto.');
     }
     // Comprobar que no queda ninguna copia antes de crear otra.
     const check=await (await api(listUrl)).json();
     if((check.files||[]).length||check.nextPageToken)throw Error('Google Drive todavía muestra copias anteriores. No se creó una copia nueva.');
     driveFileId='';localStorage.removeItem(BASE);
     await upload(data);
     // Verificación de extremo a extremo: descargar y validar el archivo recién creado.
     const response=await api('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(driveFileId)+'?alt=media');
     const stored=normalizeRemote(await response.json());
     if(!stored||await hash(stored)!==await hash(data))throw Error('La nueva copia se creó, pero no pasó la verificación de lectura.');
     localStorage.setItem(BASE,await hash(data));
     setStatus('Drive · Al día','connected');
     close();
     alert('Sincronización reiniciada y verificada. Se eliminaron '+removed+' copia(s) antiguas y la nueva copia se leyó correctamente.');
   }catch(e){setStatus('Drive · Revisar','problem');alert('No se pudo completar el reinicio: '+e.message+'\nNo se realizará una sincronización automática hasta que revises el estado.');}
   finally{busy=false}
 }
async function upload(data){const json=JSON.stringify(data);if(!driveFileId){const boundary='finanzas'+Date.now();const body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name:FILE,parents:['appDataFolder'],mimeType:'application/json'})+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+json+'\r\n--'+boundary+'--';const r=await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body});driveFileId=(await r.json()).id}else await api('https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(driveFileId)+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:json})}
function applyRemote(data){db=data;localStorage.setItem(KEY,JSON.stringify(db));close();render();window.dispatchEvent(new Event('finanzas-drive-loaded'))}
async function sync(interactive=false){
 if(busy||!cfg().clientId)return;
 if(!navigator.onLine){pendingStatus();return}
 if(conflict&&!interactive){pendingStatus();return}
 if(!token||Date.now()>=tokenExpires-60000){if(!interactive){pendingStatus();return}await authorize(true)}
 busy=true;setStatus('Drive · Sincronizando','connected');
 try{
  const local=snapshot(),lh=await hash(local),r=await remote(),rh=r?await hash(r):null,base=localStorage.getItem(BASE);
  if(!r){await upload(local);localStorage.setItem(BASE,lh)}
  else if(lh===rh){localStorage.setItem(BASE,lh)}
  else if(base===rh){await upload(local);localStorage.setItem(BASE,lh)}
  else if(base===lh){applyRemote(r);localStorage.setItem(BASE,rh)}
  else{
   conflict=true;
   if(!interactive){setStatus('Drive · Conflicto pendiente','problem');return}
   const choice=confirm('Hay cambios diferentes en este dispositivo y Google Drive.\n\nAceptar: usar los datos de Drive.\nCancelar: conservar los datos locales SIN sobrescribir Drive.\n\nAntes de decidir, exporta una copia JSON si tienes dudas.');
   if(choice){applyRemote(r);localStorage.setItem(BASE,rh)}
   else{setStatus('Drive · Conflicto pendiente','problem');return}
  }
  conflict=false;pending=false;setStatus('Drive · Al día','connected');
 }catch(e){setStatus(pending?'Drive · Pendiente':'Drive · Revisar','problem');if(interactive)alert('No se pudo sincronizar: '+e.message);console.warn('Sincronización Drive:',e)}
 finally{busy=false}
}
function schedule(){clearTimeout(timer);timer=setTimeout(()=>sync(false),1800)}
window.addEventListener('finanzas-local-save',()=>{pending=true;if(!busy)pendingStatus();schedule()});
window.addEventListener('online',()=>{if(!busy)setStatus('Drive · Reintentando','connected');schedule()});
window.addEventListener('offline',()=>{if(!busy)pendingStatus()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)schedule()});
setInterval(()=>{if(!document.hidden&&navigator.onLine&&token&&Date.now()<tokenExpires-60000)schedule()},60000);
refreshPending();
function showPanel(){const c=cfg();open(`<div class="between"><h2>Google Drive <small style="font-size:11px;color:#667085">Corrección 6.2 · 09/10/2026</small></h2><button class="iconbtn" data-action="close">✕</button></div><div class="drive-box"><p>Sincroniza tus datos privados de Mis Finanzas con tu Google Drive. Solo se solicita acceso a los datos privados de esta aplicación, no a tus otros archivos.</p><label class="field">ID de cliente OAuth (aplicación web)<input id="driveClientId" type="text" placeholder="123456789-...apps.googleusercontent.com" value="${esc(c.clientId||'')}"></label><p>En Google Cloud configura una pantalla de consentimiento y un cliente OAuth tipo <b>Aplicación web</b>. Agrega el origen HTTPS donde publiques la app en <b>Orígenes autorizados de JavaScript</b>. Si está en modo pruebas, agrega tu correo como usuario de prueba.</p><button class="secondary" id="driveSaveConfig">Guardar ID</button><button class="primary" id="driveConnect">Conectar Google y sincronizar</button><button class="secondary" id="driveSyncNow">Sincronizar ahora</button><button class="secondary" id="driveReset" style="border:1px solid #dc8791;color:#ad3c4c;background:#fff8f8">Reiniciar y verificar copia</button><p class="danger-text">Solo si no necesitas conservar la copia anterior de Mis Finanzas en Drive. Requiere doble confirmación.</p><p>Estado: <b>${esc(lastStatus)}</b>. Los datos se guardan también en este navegador. Si dos dispositivos cambian los datos a la vez, se pedirá elegir una versión para evitar sobrescrituras silenciosas.</p><p class="danger-text">No abras el HTML directamente desde Descargas para autenticarte: publícalo en HTTPS. Nunca compartas secretos OAuth ni contraseñas.</p></div>`);document.getElementById('driveSaveConfig').onclick=()=>{const id=document.getElementById('driveClientId').value.trim();if(!validId(id))return alert('ID de cliente OAuth no válido.');if(id!==cfg().clientId){token='';client=null;localStorage.removeItem(BASE)}config({clientId:id});alert('ID guardado en este navegador.')};document.getElementById('driveConnect').onclick=async()=>{try{const id=document.getElementById('driveClientId').value.trim();if(!validId(id))return alert('Primero introduce un ID OAuth válido.');if(id!==cfg().clientId){token='';client=null;localStorage.removeItem(BASE)}config({clientId:id});await authorize(true);close();await sync(true)}catch(e){alert('No se pudo conectar: '+e.message)}};document.getElementById('driveSyncNow').onclick=async()=>{close();try{await sync(true)}catch(e){alert(e.message)}};document.getElementById('driveReset').onclick=resetRemote}
if(cfg().clientId){
  // Corrección 5: la autorización de Google requiere una acción explícita.
  // prompt vacío también puede mostrar Google en navegadores móviles.
  pendingStatus();
}
})();
</script>
