name: PWA cache version
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/pwa-cache.test.js
