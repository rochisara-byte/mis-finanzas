<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico local de saldos</title><style>body{font:15px system-ui;max-width:900px;margin:25px auto;padding:0 15px;color:#263149}label{display:block;margin:14px 0}input,select{font:inherit;padding:7px}table{border-collapse:collapse;width:100%;margin-top:15px}td,th{text-align:left;padding:8px;border-bottom:1px solid #ddd}small{color:#65718a}.warn{color:#a22942}table{display:block;overflow-x:auto}</style></head><body>
<h1>Diagnóstico local de saldos</h1><p>Abre una copia JSON exportada de Mis Finanzas. Esta página no guarda ni envía datos y no modifica el archivo.</p>
<label>Copia JSON <input type="file" id="file" accept=".json,application/json"></label>
<label>Cuenta <select id="account"></select></label>
<label>Saldo mostrado por la aplicación (opcional) <input id="shown" type="number" step="any"></label>
<div id="summary" role="status"></div><div id="records"></div>
<script>
'use strict';
let data=null;const file=document.getElementById('file'),select=document.getElementById('account'),summary=document.getElementById('summary'),records=document.getElementById('records');
const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:2}).format(n);
const cell=(row,value,tag='td')=>{const node=document.createElement(tag);node.textContent=String(value);row.append(node)};
const inspect=()=>{if(!data)return;const account=data.accounts.find(a=>a.id===select.value);if(!account)return;const movements=data.transactions.filter(t=>!t.deleted&&t.status==='done'&&(t.account===account.id||t.type==='transfer'&&t.toAccount===account.id));const parts={ingresos:0,gastos:0,transferenciasEntrantes:0,transferenciasSalientes:0};const seen=new Map();for(const t of movements){const amount=Number(t.amount);if(!Number.isFinite(amount))continue;if(t.type==='income'&&t.account===account.id)parts.ingresos+=amount;if(t.type==='expense'&&t.account===account.id)parts.gastos+=amount;if(t.type==='transfer'){if(t.toAccount===account.id)parts.transferenciasEntrantes+=amount;if(t.account===account.id)parts.transferenciasSalientes+=amount}const key=JSON.stringify([t.type,t.title,t.amount,t.date,t.account,t.toAccount,t.status]);seen.set(key,(seen.get(key)||0)+1)}const initial=Number(account.opening)||0;const final=initial+parts.ingresos-parts.gastos+parts.transferenciasEntrantes-parts.transferenciasSalientes;const total=data.accounts.filter(a=>a.type!=='credit').reduce((sum,a)=>sum+Number(a.opening||0)+data.transactions.filter(t=>!t.deleted&&t.status==='done').reduce((v,t)=>v+(t.type==='income'&&t.account===a.id?Number(t.amount):0)-(t.type==='expense'&&t.account===a.id?Number(t.amount):0)+(t.type==='transfer'&&t.toAccount===a.id?Number(t.amount):0)-(t.type==='transfer'&&t.account===a.id?Number(t.amount):0),0),0);const shown=Number(document.getElementById('shown').value);summary.replaceChildren();const lines=[`Saldo inicial: ${money(initial)}`,`Ingresos realizados: ${money(parts.ingresos)}`,`Gastos realizados: ${money(parts.gastos)}`,`Transferencias entrantes: ${money(parts.transferenciasEntrantes)}`,`Transferencias salientes: ${money(parts.transferenciasSalientes)}`,`Saldo reconstruido de ${account.name}: ${money(final)}`,`Suma de cuentas no crédito (Saldo real de Inicio): ${money(total)}`];if(document.getElementById('shown').value)lines.push(`Diferencia con valor introducido: ${money(final-shown)}`);lines.forEach(line=>{const p=document.createElement('p');p.textContent=line;summary.append(p)});const suspects=[...seen.values()].filter(count=>count>1).length;if(suspects){const p=document.createElement('p');p.className='warn';p.textContent=`${suspects} grupos de movimientos con atributos iguales. Pueden ser pagos independientes; revisar manualmente.`;summary.append(p)}records.replaceChildren();const table=document.createElement('table'),head=document.createElement('tr');['Fecha','Concepto','Tipo','Importe','Estado','Origen','Destino','ID'].forEach(v=>cell(head,v,'th'));table.append(head);movements.sort((a,b)=>(b.date||'').localeCompare(a.date||'')).forEach(t=>{const row=document.createElement('tr');[t.date||'',t.title||'',t.type,money(Number(t.amount)||0),t.status,t.account||'',t.toAccount||'',t.id||''].forEach(v=>cell(row,v));table.append(row)});records.append(table)};
file.addEventListener('change',async()=>{try{const copy=JSON.parse(await file.files[0].text());if(!Array.isArray(copy.accounts)||!Array.isArray(copy.transactions))throw Error('La copia no tiene cuentas y movimientos válidos.');data=copy;select.replaceChildren();for(const account of copy.accounts){const option=document.createElement('option');option.value=account.id;option.textContent=account.name;select.append(option)}inspect()}catch(error){data=null;summary.textContent=error.message;records.replaceChildren()}});select.addEventListener('change',inspect);document.getElementById('shown').addEventListener('input',inspect);
</script></body></html>
